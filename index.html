<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrator - Manajemen Status Interaktif</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- Header / Navigation -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-indigo-600 rounded-lg">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">Admin Dashboard</h1>
                    <p class="text-xs text-slate-400">Klik langsung pada badge status untuk memutar status</p>
                </div>
            </div>
            <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1.5 animate-pulse"></span> Mode Admin Aktif
            </span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">

        <!-- Ringkasan Stat Cards -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-xs text-slate-500 font-medium">Total Permohonan</p>
                <p id="stat-total" class="text-2xl font-bold text-slate-800 mt-1">0</p>
            </div>
            <div class="bg-amber-50/50 p-4 rounded-xl border border-amber-200 shadow-sm">
                <p class="text-xs text-amber-700 font-medium">Pending</p>
                <p id="stat-pending" class="text-2xl font-bold text-amber-700 mt-1">0</p>
            </div>
            <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-200 shadow-sm">
                <p class="text-xs text-blue-700 font-medium">Diproses</p>
                <p id="stat-diproses" class="text-2xl font-bold text-blue-700 mt-1">0</p>
            </div>
            <div class="bg-emerald-50/50 p-4 rounded-xl border border-emerald-200 shadow-sm">
                <p class="text-xs text-emerald-700 font-medium">Selesai</p>
                <p id="stat-selesai" class="text-2xl font-bold text-emerald-700 mt-1">0</p>
            </div>
            <div class="bg-rose-50/50 p-4 rounded-xl border border-rose-200 shadow-sm col-span-2 md:col-span-1">
                <p class="text-xs text-rose-700 font-medium">Ditolak</p>
                <p id="stat-ditolak" class="text-2xl font-bold text-rose-700 mt-1">0</p>
            </div>
        </div>

        <!-- Filter & Search Bar -->
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div class="relative flex-1">
                <input type="text" id="searchInput" oninput="filterData()" placeholder="Cari nama pemohon atau jenis layanan..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
            <div class="flex items-center gap-2">
                <select id="statusFilter" onchange="filterData()" class="border border-slate-300 rounded-lg text-sm px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="Semua">Semua Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Diproses">Diproses</option>
                    <option value="Selesai">Selesai</option>
                    <option value="Ditolak">Ditolak</option>
                </select>
                <button onclick="toggleModal(true)" class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-lg flex items-center gap-1.5 transition-colors shadow-sm ml-auto">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                    Tambah Data
                </button>
            </div>
        </div>

        <!-- Tabel Data Admin -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-100 text-slate-600 text-xs font-semibold uppercase tracking-wider border-b border-slate-200">
                            <th class="px-5 py-3.5">ID Reg</th>
                            <th class="px-5 py-3.5">Pemohon</th>
                            <th class="px-5 py-3.5">Layanan</th>
                            <th class="px-5 py-3.5">Tanggal</th>
                            <th class="px-5 py-3.5 text-center">Status (Klik untuk Recycle)</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Diisi otomatis oleh JavaScript -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="hidden p-8 text-center text-slate-500 text-sm">
                Tidak ada data yang sesuai.
            </div>
        </div>
    </main>

    <!-- Modal Tambah Data Baru -->
    <div id="modalContainer" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-xl max-w-md w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800 text-lg">Tambah Permohonan Baru</h3>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>
            <form id="addForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Nama Pemohon</label>
                    <input type="text" id="inputName" required placeholder="Nama lengkap..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Jenis Layanan</label>
                    <input type="text" id="inputService" required placeholder="Jenis permohonan/layanan..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Status Awal</label>
                    <select id="inputStatus" class="w-full px-3 py-2 border rounded-lg text-sm bg-white focus:ring-2 focus:ring-indigo-500 outline-none">
                        <option value="Pending">Pending</option>
                        <option value="Diproses">Diproses</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Ditolak">Ditolak</option>
                    </select>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="toggleModal(false)" class="px-4 py-2 border text-slate-600 hover:bg-slate-50 text-sm font-medium rounded-lg">Batal</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT -->
    <script>
        // Urutan perputaran/siklus status otomatis
        const statusSequence = ['Pending', 'Diproses', 'Selesai', 'Ditolak'];

        // Data awal
        let applicationData = [
            { id: "REG-001", name: "Ahmad Dahlan", service: "Surat Keterangan Domisili", date: "2026-08-10", status: "Pending" },
            { id: "REG-002", name: "Siti Rahma", service: "Legalisasi Dokumen", date: "2026-08-10", status: "Diproses" },
            { id: "REG-003", name: "Budi Santoso", service: "Izin Usaha Mikro (IUMK)", date: "2026-08-09", status: "Selesai" },
            { id: "REG-004", name: "Dewi Lestari", service: "Pengajuan Kartu Identitas", date: "2026-08-08", status: "Ditolak" }
        ];

        // 1. Fungsi Recycle Status (Dipanggil saat tombol status diklik)
        function handleRecycleStatus(id) {
            const index = applicationData.findIndex(item => item.id === id);
            if (index !== -1) {
                let currentStatus = applicationData[index].status;
                let currentIndex = statusSequence.indexOf(currentStatus);
                let nextIndex = (currentIndex + 1) % statusSequence.length;
                
                // Ubah ke status berikutnya dalam urutan
                applicationData[index].status = statusSequence[nextIndex];

                // Render ulang data tabel & perbarui kartu statistik
                renderTable();
            }
        }

        // 2. Definisi Warna & Gaya Badge Status
        function getStatusConfig(status) {
            switch (status) {
                case 'Pending':
                    return {
                        classes: 'bg-amber-100 text-amber-800 border-amber-300 hover:bg-amber-200 hover:border-amber-400 active:bg-amber-300',
                        dot: 'bg-amber-500'
                    };
                case 'Diproses':
                    return {
                        classes: 'bg-blue-100 text-blue-800 border-blue-300 hover:bg-blue-200 hover:border-blue-400 active:bg-blue-300',
                        dot: 'bg-blue-500'
                    };
                case 'Selesai':
                    return {
                        classes: 'bg-emerald-100 text-emerald-800 border-emerald-300 hover:bg-emerald-200 hover:border-emerald-400 active:bg-emerald-300',
                        dot: 'bg-emerald-500'
                    };
                case 'Ditolak':
                    return {
                        classes: 'bg-rose-100 text-rose-800 border-rose-300 hover:bg-rose-200 hover:border-rose-400 active:bg-rose-300',
                        dot: 'bg-rose-500'
                    };
                default:
                    return {
                        classes: 'bg-slate-100 text-slate-800 border-slate-300 hover:bg-slate-200',
                        dot: 'bg-slate-500'
                    };
            }
        }

        // 3. Render Tabel dengan Tombol Status Berputar
        function renderTable() {
            const tbody = document.getElementById('adminTableBody');
            const searchValue = document.getElementById('searchInput').value.toLowerCase();
            const filterValue = document.getElementById('statusFilter').value;

            const filteredData = applicationData.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchValue) || 
                                      item.service.toLowerCase().includes(searchValue) ||
                                      item.id.toLowerCase().includes(searchValue);
                const matchesFilter = (filterValue === 'Semua') || (item.status === filterValue);
                return matchesSearch && matchesFilter;
            });

            updateStats();

            const emptyState = document.getElementById('emptyState');
            if (filteredData.length === 0) {
                tbody.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }
            emptyState.classList.add('hidden');

            tbody.innerHTML = filteredData.map(item => {
                const config = getStatusConfig(item.status);
                return `
                    <tr class="hover:bg-slate-50/80 transition-colors">
                        <td class="px-5 py-4 font-mono text-xs font-bold text-slate-500">${item.id}</td>
                        <td class="px-5 py-4 font-medium text-slate-800">${item.name}</td>
                        <td class="px-5 py-4 text-slate-600">${item.service}</td>
                        <td class="px-5 py-4 text-slate-500 text-xs">${item.date}</td>
                        <td class="px-5 py-4 text-center">
                            <!-- Tombol Recycle Status Interaktif -->
                            <button onclick="handleRecycleStatus('${item.id}')"
                                    title="Klik untuk mengubah status secara otomatis"
                                    class="group inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full text-xs font-semibold border shadow-sm transition-all duration-150 cursor-pointer active:scale-95 ${config.classes}">
                                <span class="w-2 h-2 rounded-full ${config.dot}"></span>
                                <span>${item.status}</span>
                                <svg class="w-3.5 h-3.5 opacity-60 group-hover:opacity-100 group-hover:rotate-180 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                </svg>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 4. Update Ringkasan Stat
        function updateStats() {
            document.getElementById('stat-total').innerText = applicationData.length;
            document.getElementById('stat-pending').innerText = applicationData.filter(i => i.status === 'Pending').length;
            document.getElementById('stat-diproses').innerText = applicationData.filter(i => i.status === 'Diproses').length;
            document.getElementById('stat-selesai').innerText = applicationData.filter(i => i.status === 'Selesai').length;
            document.getElementById('stat-ditolak').innerText = applicationData.filter(i => i.status === 'Ditolak').length;
        }

        // 5. Filter & Pencarian
        function filterData() {
            renderTable();
        }

        // 6. Modal Toggle
        function toggleModal(show) {
            const modal = document.getElementById('modalContainer');
            if (show) {
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        // 7. Form Handler Tambah Data
        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('inputName').value;
            const service = document.getElementById('inputService').value;
            const status = document.getElementById('inputStatus').value;

            const newId = `REG-00${applicationData.length + 1}`;
            const today = new Date().toISOString().split('T')[0];

            applicationData.unshift({
                id: newId,
                name: name,
                service: service,
                date: today,
                status: status
            });

            document.getElementById('addForm').reset();
            toggleModal(false);
            renderTable();
        }

        // Inisialisasi awal
        window.onload = function() {
            renderTable();
        };
    </script>
</body>
</html>
